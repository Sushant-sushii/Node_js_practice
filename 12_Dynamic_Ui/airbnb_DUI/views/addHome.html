<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Home | Airbnb</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f7f7f7;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .hero {
            background: #ff385c;
            color: white;
            padding: 30px 30px 24px;
        }
        .hero h1 {
            margin-bottom: 8px;
            font-size: 28px;
            line-height: 1.1;
        }
        .hero p {
            margin: 0;
            opacity: 0.92;
            font-size: 15px;
        }
        .form-card {
            padding: 30px;
        }
        .form-card label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            color: #333;
        }
        .form-card input,
        .form-card textarea,
        .form-card select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 18px;
            transition: border-color 0.2s ease;
        }
        .form-card input:focus,
        .form-card textarea:focus,
        .form-card select:focus {
            outline: none;
            border-color: #ff385c;
        }
        .form-card button {
            width: 100%;
            padding: 14px;
            background: #ff385c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .form-card button:hover {
            background: #e63551;
        }
        .form-card .hint {
            font-size: 13px;
            color: #666;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>Register your home here</h1>
            <p>Share your space and start hosting guests.</p>
        </div>
        <div class="form-card">
            <p class="hint">Enter your home details below and submit to add the listing.</p>
            <form action="/host/add-home" method="post">
                <label for="home-name">Home Name</label>
                <input type="text" id="home-name" name="homeName" placeholder="Home Name" required>

                <label for="home-location">Home Location</label>
                <input type="text" id="home-location" name="homeLocation" placeholder="Home Location" required>

                <label for="home-type">Home Type</label>
                <select id="home-type" name="homeType">
                    <option value="Entire place">Entire place</option>
                    <option value="Private room">Private room</option>
                    <option value="Shared room">Shared room</option>
                </select>

                <label for="home-description">Description</label>
                <textarea id="home-description" name="homeDescription" placeholder="Short description of your home" rows="4"></textarea>

                <button type="submit">Add Home</button>
            </form>
        </div>
    </div>
</body>
</html>
