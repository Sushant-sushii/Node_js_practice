<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f7f7f7;
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .page {
            max-width: 560px;
            background: white;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 72px;
            margin-bottom: 0;
            color: #ff385c;
        }
        p {
            font-size: 18px;
            margin: 20px 0 30px;
            line-height: 1.6;
        }
        a {
            display: inline-block;
            padding: 14px 28px;
            background: #ff385c;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 700;
        }
        a:hover {
            background: #e63447;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>404</h1>
        <p>Sorry, we couldn't find the page you were looking for. It may have been moved or deleted.</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
